[project]
name = "graveyard-forensics"
version = "0.1.0"
description = "Audit a GitHub user/org estate for stub repos, fake price claims, and monetizable keepers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kiliaan Vanvoorden", email = "bakerstreetbandit@zohomail.eu" }]
dependencies = [
  "jinja2>=3.1",
  "weasyprint>=69.0",
]

[project.scripts]
graveyard = "graveyard_forensics.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graveyard_forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
